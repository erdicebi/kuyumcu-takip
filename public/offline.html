<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>Çevrimdışı · Kuyumcu Takip</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#0d0d0f; color:#f5f5f7; padding:28px; text-align:center; }
      main { width:min(100%,420px); }
      .logo { width:76px; height:76px; margin:auto; display:grid; place-items:center; border-radius:24px; background:linear-gradient(145deg,#e9d9aa,#b98b31 50%,#654720); color:white; font:900 34px Georgia,serif; box-shadow:0 22px 70px rgba(185,139,49,.25); }
      h1 { margin:28px 0 10px; font-size:30px; letter-spacing:-.045em; }
      p { margin:0; color:#a1a1aa; line-height:1.65; font-size:15px; }
      button { margin-top:28px; width:100%; height:50px; border:0; border-radius:17px; background:#f5f5f7; color:#171719; font:700 14px inherit; cursor:pointer; }
      small { display:block; margin-top:22px; color:#64646b; font-size:11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">K</div>
      <h1>Bağlantı bekleniyor</h1>
      <p>Fatura bilgileri güvenliğiniz için cihazda çevrimdışı saklanmaz. İnternet bağlantısı geldiğinde kaldığınız yerden devam edebilirsiniz.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
      <small>Kuyumcu Takip · Güvenli fatura yönetimi</small>
    </main>
  </body>
</html>
